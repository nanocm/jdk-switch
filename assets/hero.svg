<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
  <title id="title">jdk-switch</title>
  <desc id="desc">jdk-switch: list, download, and switch JDKs with jsh.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c32"/>
      <stop offset="1" stop-color="#0b1426"/>
