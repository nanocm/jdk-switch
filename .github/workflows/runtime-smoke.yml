name: Real JDK runtime smoke

on:
  workflow_call:
  workflow_dispatch:

jobs:
  windows-jdk8:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17 for switching test
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build jsh
        run: cargo build --release --locked
      - name: Download, list, and switch real JDKs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NO_COLOR = '1'
          $jsh = Join-Path $PWD 'target\release\jsh.exe'
          $configPath = Join-Path (Split-Path $jsh) 'jsh_config.json'
          @{ install_dir = 'managed-jdks'; download_dir = 'downloads' } |
            ConvertTo-Json | Set-Content -LiteralPath $configPath -Encoding UTF8
          $list = & $jsh list
          if ($LASTEXITCODE -ne 0 -or -not ($list | Select-String -SimpleMatch 'JDK 17')) {
            throw "Java 17 is missing from jsh list"
          }
          & $jsh download 8
          if ($LASTEXITCODE -ne 0) { throw "jsh download 8 failed" }
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $config.jdks = @{}
          $config | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $configPath -Encoding UTF8
          $list = & $jsh list
          if ($LASTEXITCODE -ne 0) { throw "jsh list failed" }
          $list | Write-Output
          if (-not ($list | Select-String -SimpleMatch 'JDK 8')) {
            throw "Downloaded JDK 8 is missing from jsh list"
          }
          if (-not ($list | Select-String -SimpleMatch 'managed-jdks')) {
            throw "Downloaded JDK 8 was not discovered in the configured install directory"
          }
          & $jsh use 17
          if ($LASTEXITCODE -ne 0) { throw "jsh use 17 failed" }
          $env:JAVA_HOME = Join-Path (Split-Path $jsh) 'jsh-current'
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          & $jsh use 8
          if ($LASTEXITCODE -ne 0) { throw "jsh use 8 failed" }
          $javaVersion = (& java.exe -version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $javaVersion -notmatch 'version "1\.8\.0_') {
            throw "Open terminal still uses the wrong Java: $javaVersion"
          }
          $javacVersion = (& javac.exe -version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $javacVersion -notmatch 'javac 1\.8\.0_') {
            throw "Open terminal still uses the wrong javac: $javacVersion"
          }
          $current = & $jsh current
          if ($LASTEXITCODE -ne 0 -or -not ($current | Select-String -SimpleMatch 'JDK 8')) {
            throw "jsh current does not report JDK 8"
          }
          if ($current | Select-String -SimpleMatch 'java on PATH resolves to') {
            throw "jsh current reports a PATH mismatch"
          }
          & $jsh download 8 --vendor corretto
          if ($LASTEXITCODE -ne 0) { throw "Corretto 8 download failed" }
          $list = & $jsh list
          if ($LASTEXITCODE -ne 0 -or -not ($list | Select-String -SimpleMatch 'jdk-corretto-')) {
            throw "Corretto 8 is missing from jsh list"
          }
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $corretto = @($config.jdks.PSObject.Properties | Where-Object {
            $_.Value.path -match '[\\/]jdk-corretto-'
          })
          if ($corretto.Count -ne 1) { throw "Expected one Corretto registration, found $($corretto.Count)" }
          & $jsh use $corretto[0].Name
          if ($LASTEXITCODE -ne 0) { throw "jsh use Corretto ID failed" }
          $javaVersion = (& java.exe -version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $javaVersion -notmatch 'Corretto') {
            throw "Open terminal still uses the wrong vendor: $javaVersion"
          }
          & $jsh use 8 *> $null
          if ($LASTEXITCODE -eq 0) { throw "jsh use 8 accepted ambiguous JDKs" }
          $global:LASTEXITCODE = 0

  real-jdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vendor: zulu
          - os: macos-15-intel
            vendor: openjdk
          - os: macos-latest
            vendor: corretto
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Confirm ARM64 runner
        if: matrix.os == 'macos-latest'
        run: test "$(uname -m)" = arm64
      - name: Install Java 17 for switching test
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build jsh
        run: cargo build --release --locked
      - name: Download Java 21 and switch real JDKs
        shell: bash
        env:
          JSH_EXTRA_VENDOR: ${{ matrix.vendor }}
        run: bash scripts/smoke-unix.sh
