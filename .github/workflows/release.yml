name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  smoke:
    uses: ./.github/workflows/runtime-smoke.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Test
        run: cargo test --locked
      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --locked
      - name: Build both macOS architectures
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -LiteralPath target/release/jsh.exe -DestinationPath "dist/jsh-${{ github.ref_name }}-${{ matrix.platform }}.zip"
      - name: Package Unix binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/jsh-${{ github.ref_name }}-${{ matrix.platform }}-$(uname -m).tar.gz" -C target/release jsh
      - name: Package macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/jsh-${{ github.ref_name }}-macos-arm64.tar.gz" -C target/aarch64-apple-darwin/release jsh
          tar -czf "dist/jsh-${{ github.ref_name }}-macos-x64.tar.gz" -C target/x86_64-apple-darwin/release jsh
      - uses: actions/upload-artifact@v4
        with:
          name: jsh-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum jsh-* install.sh install.ps1 > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* --title "jdk-switch $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
